services:
  # Backend API
  - type: web
    name: dobro-backend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: dobro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dobro-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://dobro-frontend.onrender.com
    healthCheckPath: /health

  # Frontend
  - type: web
    name: dobro-frontend
    runtime: static
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dobro-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: dobro-db
    databaseName: dobro_db
    user: dobro
    region: frankfurt
    plan: free

  - name: dobro-redis
    region: frankfurt
    plan: free
    maxmemoryPolicy: noeviction
